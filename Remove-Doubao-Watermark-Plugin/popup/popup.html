<!DOCTYPE html>
<html>
<head>
  <title>豆包图片下载</title>
  <meta charset="UTF-8">
  <style>
    body {
      width: 300px;
      font-family: sans-serif;
      text-align: center;
      padding: 10px;
    }
    button {
      margin-top: 10px;
      padding: 8px 15px;
      cursor: pointer;
      background-color: #1890ff;
      color: white;
      border: none;
      border-radius: 4px;
      transition: background-color 0.3s;
    }
    button:hover {
      background-color: #40a9ff;
    }
    p {
      margin-top: 5px;
      margin-bottom: 5px;
      font-size: 12px;
    }
    .feature {
      margin: 10px 0;
      text-align: left;
      padding: 5px;
      border-left: 3px solid #1890ff;
      background-color: #f0f5ff;
    }
    .divider {
      height: 1px;
      background-color: #e8e8e8;
      margin: 15px 0;
    }
  </style>
</head>
<body>
  <h3>豆包图片去水印</h3>
  
  <div class="feature">
    <strong>方式一：</strong> 右键点击图片，使用"无水印复制"或"无水印下载"
  </div>
  
  <div class="feature">
    <strong>方式二：</strong> 点击下方按钮下载当前图片
  </div>
  
  <div class="divider"></div>
  
  <button id="downloadBtn">下载当前图片</button>
  <p id="status"></p>
  <script src="popup.js"></script>
</body>
</html>
